apiVersion: v1
kind: ConfigMap
metadata:
  name: neuraops-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"   # This label tells Grafana's sidecar to import this dashboard automatically
data:
  neuraops-overview.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [],
      "refresh": "10s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["neuraops"],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "NeuraOps Overview",
      "uid": "neuraops-overview",
      "version": 1,
      "weekStart": ""

